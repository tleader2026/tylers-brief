name: Daily dashboard refresh
on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tylers-brief-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/run-daily-dashboard-refresh.mjs
        env:
          DAILY_REFRESH_KEY: ${{ secrets.DAILY_REFRESH_KEY }}
